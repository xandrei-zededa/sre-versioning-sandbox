repos:
  # 1. Быстрые файловые проверки (только на измененные файлы!)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # 2. Мгновенная проверка формата сообщения (0.05 сек)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [
          "feat", "fix", "docs", "style", "refactor",
          "perf", "test", "build", "ci", "chore", "revert"
        ]

  # 3. Мгновенное форматирование только измененных файлов HCL (0.1 сек)
  - repo: local
    hooks:
      - id: tofu-fmt
        name: OpenTofu Format Check
        entry: tofu fmt -check
        language: system
        files: \.tf$|\.tftest\.hcl$
