repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [
          "feat", "fix", "docs", "style", "refactor",
          "perf", "test", "build", "ci", "chore", "revert"
        ]

  - repo: local
    hooks:
      - id: tofu-fmt
        name: OpenTofu Format Check (All Modules)
        entry: tofu fmt -check -recursive terraform-modules
        language: system
        pass_filenames: false

      - id: trivy-config
        name: Trivy Security Scan (All Modules)
        entry: trivy config --skip-check-update --severity HIGH,CRITICAL terraform-modules
        language: system
        pass_filenames: false

      - id: tofu-test-all
        name: OpenTofu Unit Tests (All Modules via Zero-Cloud Mocks)
        entry: bash -c "for d in terraform-modules/parts/aws/* terraform-modules/parts/sandbox-test; do if [ -d \"$d/tests\" ]; then (cd \"$d\" && tofu init -backend=false > /dev/null 2>&1 && tofu test); fi; done"
        language: system
        pass_filenames: false
