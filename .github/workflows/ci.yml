name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      has_modules: ${{ steps.filter.outputs.modules_any }}
      changed_modules: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            modules_any: 'terraform-modules/**'
            aws-eks: 'terraform-modules/parts/aws/aws_eks/**'
            irsa-role: 'terraform-modules/parts/aws/irsa_role/**'
            rds-postgres: 'terraform-modules/parts/aws/rds-postgres/**'
            s3-bucket: 'terraform-modules/parts/aws/s3-bucket/**'
            sqs-queue: 'terraform-modules/parts/aws/sqs-queue/**'
            sandbox-test: 'terraform-modules/parts/sandbox-test/**'

  lint-and-security:
    name: Fast Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Fast Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

  unit-tests:
    name: Unit Test Changed
    needs: filter
    # НЕ запускать тесты вообще, если файлы модулей не менялись (например, меняли README, CI или Terragrunt)
    if: needs.filter.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: Run Tests ONLY on Modified Modules in PR
        run: |
          CHANGES='${{ needs.filter.outputs.changed_modules }}'
          echo "Changed packages: $CHANGES"

          # Находит измененные папки и запускает tofu test строго в них в 1 шаг без 6 отдельных виртуалок
          for pkg in $(echo "$CHANGES" | jq -r '.[]'); do
            case "$pkg" in
              "aws-eks") dir="terraform-modules/parts/aws/aws_eks" ;;
              "irsa-role") dir="terraform-modules/parts/aws/irsa_role" ;;
              "rds-postgres") dir="terraform-modules/parts/aws/rds-postgres" ;;
              "s3-bucket") dir="terraform-modules/parts/aws/s3-bucket" ;;
              "sqs-queue") dir="terraform-modules/parts/aws/sqs-queue" ;;
              "sandbox-test") dir="terraform-modules/parts/sandbox-test" ;;
            esac
            if [ -n "$dir" ] && [ -d "$dir/tests" ]; then
              echo ">>> Testing modified module: $dir"
              (cd "$dir" && tofu init -backend=false > /dev/null 2>&1 && tofu test)
            fi
          done
          echo "Done testing modified modules."
