name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    name: Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Run OpenTofu Tests (All Modules in 1 Fast Pass)
        run: |
          echo "=== RUNNING UNIT TESTS ON ALL TESTABLE MODULES ==="
          FAILED=0
          for test_file in $(find terraform-modules -name "*.tftest.hcl"); do
            dir=$(dirname "$test_file" | sed 's/\/tests$//')
            echo ">>> Testing module: $dir"
            (cd "$dir" && tofu init -backend=false > /dev/null 2>&1 && tofu test) || FAILED=1
          done
          if [ $FAILED -ne 0 ]; then
            echo "❌ Some module unit tests failed!"
            exit 1
          fi
          echo "✅ All module unit tests passed successfully!"
