name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
      has_modules: ${{ steps.set-matrix.outputs.has_modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute Changed Modules Dynamically
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi

          echo "Comparing against: $BASE_REF"
          
          # Find all testable modules with a tests directory
          ALL_MODULES=$(find terraform-modules -name "*.tftest.hcl" -exec dirname {} + | sed 's/\/tests$//' | sort -u)
          
          CHANGED_MODULES=()
          for mod in $ALL_MODULES; do
            # If on push to main or files in this specific module changed
            if [ "${{ github.event_name }}" == "push" ] || git diff --name-only $BASE_REF HEAD | grep -q "^$mod/"; then
              pkg_name=$(basename "$mod" | tr '_' '-')
              CHANGED_MODULES+=("{\"name\":\"$pkg_name\",\"path\":\"$mod\"}")
            fi
          done

          if [ ${#CHANGED_MODULES[@]} -eq 0 ]; then
            echo "No modules changed."
            echo "has_modules=false" >> $GITHUB_OUTPUT
            echo "modules=[]" >> $GITHUB_OUTPUT
          else
            JSON="[$(IFS=,; echo "${CHANGED_MODULES[*]}")]"
            echo "Targeted modules to test: $JSON"
            echo "has_modules=true" >> $GITHUB_OUTPUT
            echo "modules=$JSON" >> $GITHUB_OUTPUT
          fi

  lint-and-security:
    name: Lint, Docs & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Security Scan with Trivy (HCL Misconfiguration)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Generate Module Documentation
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform-modules/parts/aws/aws_eks,terraform-modules/parts/aws/irsa_role,terraform-modules/parts/sandbox-test,terraform-modules/parts/aws/s3-bucket,terraform-modules/parts/aws/rds-postgres
          output-file: README.md
          output-method: inject
          git-push: "false"

  unit-tests:
    name: Unit Test
    needs: detect-changes
    if: needs.detect-changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Test ${{ matrix.module.name }} (tofu test + mock_provider)
        working-directory: ${{ matrix.module.path }}
        run: |
          tofu init -backend=false
          tofu test
