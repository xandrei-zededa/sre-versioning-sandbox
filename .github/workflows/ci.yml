name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      has_changes: ${{ steps.filter.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7

      # Official Marketplace Action: conditional matrix output based on file changes
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aws-eks: 'terraform-modules/parts/aws/aws_eks/**'
            irsa-role: 'terraform-modules/parts/aws/irsa_role/**'
            rds-postgres: 'terraform-modules/parts/aws/rds-postgres/**'
            s3-bucket: 'terraform-modules/parts/aws/s3-bucket/**'
            sandbox-test: 'terraform-modules/parts/sandbox-test/**'

  lint-and-security:
    name: Lint, Docs & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Security Scan with Trivy (HCL Misconfiguration)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Generate Module Documentation
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform-modules/parts/aws/aws_eks,terraform-modules/parts/aws/irsa_role,terraform-modules/parts/sandbox-test,terraform-modules/parts/aws/s3-bucket,terraform-modules/parts/aws/rds-postgres
          output-file: README.md
          output-method: inject
          git-push: "false"

  unit-tests:
    name: Unit Test
    needs: filter
    # Push to main runs all tests; PRs run ONLY if packages were modified
    if: github.event_name == 'push' || needs.filter.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ github.event_name == 'push' && fromJson('["aws-eks","irsa-role","rds-postgres","s3-bucket","sandbox-test"]') || fromJson(needs.filter.outputs.packages) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Map Package Name to Module Path
        id: map
        run: |
          case "${{ matrix.package }}" in
            "aws-eks") echo "path=terraform-modules/parts/aws/aws_eks" >> $GITHUB_OUTPUT ;;
            "irsa-role") echo "path=terraform-modules/parts/aws/irsa_role" >> $GITHUB_OUTPUT ;;
            "rds-postgres") echo "path=terraform-modules/parts/aws/rds-postgres" >> $GITHUB_OUTPUT ;;
            "s3-bucket") echo "path=terraform-modules/parts/aws/s3-bucket" >> $GITHUB_OUTPUT ;;
            "sandbox-test") echo "path=terraform-modules/parts/sandbox-test" >> $GITHUB_OUTPUT ;;
          esac

      - name: Test ${{ matrix.package }} (tofu test + mock_provider)
        working-directory: ${{ steps.map.outputs.path }}
        run: |
          tofu init -backend=false
          tofu test
