name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  discover-modules:
    name: Auto-Discover Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover testable modules
        id: discover
        run: |
          MODULES=$(find terraform-modules -name "*.tftest.hcl" -exec dirname {} + | sed 's/\/tests$//' | sort -u | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map({
              name: (split("/") | last | gsub("_"; "-")),
              path: .
            })
          ')
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

  lint-and-security:
    name: Lint, Docs & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu (Fast & Cached)
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Fast Offline Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Generate Module Documentation
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform-modules/parts/aws/aws_eks,terraform-modules/parts/aws/irsa_role,terraform-modules/parts/sandbox-test,terraform-modules/parts/aws/s3-bucket,terraform-modules/parts/aws/rds-postgres,terraform-modules/parts/aws/sqs-queue
          output-file: README.md
          output-method: inject
          git-push: "false"

  unit-tests:
    name: Unit Test
    needs: discover-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - uses: actions/checkout@v7

      - name: Restore OpenTofu Provider Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tofu-providers-${{ runner.os }}-

      - name: Setup OpenTofu (No Wrapper Overhead)
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: Test ${{ matrix.module.name }} (Fast Mock Run)
        working-directory: ${{ matrix.module.path }}
        run: |
          mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}
          tofu init -backend=false
          tofu test
