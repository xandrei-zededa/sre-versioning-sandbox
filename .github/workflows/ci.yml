name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Lint, Docs & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Security Scan with Trivy (HCL Misconfiguration)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Generate Module Documentation
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform-modules/parts/aws/aws_eks,terraform-modules/parts/aws/irsa_role,terraform-modules/parts/sandbox-test,terraform-modules/parts/aws/s3-bucket,terraform-modules/parts/aws/rds-postgres
          output-file: README.md
          output-method: inject
          git-push: "false"

  unit-tests:
    name: Unit Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: "sandbox-test"
            path: "terraform-modules/parts/sandbox-test"
          - name: "aws-eks"
            path: "terraform-modules/parts/aws/aws_eks"
          - name: "irsa-role"
            path: "terraform-modules/parts/aws/irsa_role"
          - name: "s3-bucket"
            path: "terraform-modules/parts/aws/s3-bucket"
          - name: "rds-postgres"
            path: "terraform-modules/parts/aws/rds-postgres"

    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Test ${{ matrix.module.name }} (tofu test + mock_provider)
        working-directory: ${{ matrix.module.path }}
        run: |
          tofu init -backend=false
          tofu test
