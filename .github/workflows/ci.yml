name: CI (Terraform & OpenTofu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Security & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive terraform-modules

      - name: Security Scan with Trivy (HCL Misconfiguration)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform-modules"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Run OpenTofu Unit Tests (Mocking)
        run: |
          for d in terraform-modules/parts/sandbox-test \
                   terraform-modules/parts/aws/irsa_role \
                   terraform-modules/parts/aws/aws_eks; do
            echo "Testing module: $d"
            (cd "$d" && tofu init -backend=false && tofu test)
          done
