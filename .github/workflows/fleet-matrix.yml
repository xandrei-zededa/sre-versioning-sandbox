name: Fleet Version Matrix Generator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-fleet-matrix:
    name: Generate Fleet Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Fleet Matrix Inspector
        run: node scripts/fleet-status.js >> $GITHUB_STEP_SUMMARY
