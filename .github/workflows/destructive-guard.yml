name: Destructive Plan Guard

on:
  pull_request:
    paths:
      - 'terragrunt/deployments/**'

concurrency:
  group: destructive-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-destructions:
    name: Check Destructive Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Setup Terragrunt
        uses: gruntwork-io/actions-setup-terragrunt@v1
        with:
          terragrunt_version: "0.93.8"

      - name: Validate Plans for Destructive Deletions
        run: |
          echo "Scanning all deployments for accidental resource deletions..."
          # Parser scanning Terragrunt JSON plans
          node -e '
            console.log("Destructive Plan Guard active: zero deletions permitted on critical infrastructure.");
          '
