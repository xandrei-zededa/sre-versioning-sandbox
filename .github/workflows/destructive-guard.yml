name: Destructive Plan Guard

on:
  pull_request:
    paths:
      - 'terragrunt/deployments/**'

concurrency:
  group: destructive-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-destructions:
    name: Check Destructive Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce Zero-Destruction Guard on Protected Environments
        run: |
          echo "Scanning PR for accidental resource removals..."
          # If deployment changes contain removal markers, fail CI
          if git diff origin/main HEAD | grep -E "^\-.*(aws_eks_cluster|aws_db_instance|aws_s3_bucket)" > /dev/null 2>&1; then
            echo "❌ CRITICAL SECURITY GUARD: Accidental deletion of protected infrastructure detected!"
            exit 1
          fi
          echo "✅ Guard passed: no destructive deletions found."
