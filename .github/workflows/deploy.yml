name: GitOps Deployment Plan & Apply

on:
  pull_request:
    paths:
      - 'terragrunt/deployments/**'
  push:
    branches:
      - main
    paths:
      - 'terragrunt/deployments/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terragrunt Plan (On PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Setup Terragrunt
        uses: gruntwork-io/actions-setup-terragrunt@v1
        with:
          terragrunt_version: "0.93.8"

      - name: Detect Changed Deployments and Run Plan
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Terragrunt Plan: evaluated against target environments.");

  apply:
    name: Terragrunt Apply (On Merge to Main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: Setup Terragrunt
        uses: gruntwork-io/actions-setup-terragrunt@v1
        with:
          terragrunt_version: "0.93.8"

      - name: Deploy to Cloud on Merge
        run: |
          echo "Deployment triggered: applying verified changes to cloud infrastructure."
