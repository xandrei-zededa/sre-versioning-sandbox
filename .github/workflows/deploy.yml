name: GitOps Deployment Plan & Apply

on:
  pull_request:
    paths:
      - 'terragrunt/deployments/**'
  push:
    branches:
      - main
    paths:
      - 'terragrunt/deployments/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terragrunt Plan (On PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.93.8"

      - name: Validate Plan on Modified Deployments
        run: |
          echo "Terragrunt Plan: verified on target deployments."

  apply:
    name: Terragrunt Apply (On Merge to Main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"
          tofu_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.93.8"

      - name: Deploy to Cloud on Merge
        run: |
          echo "Deployment triggered: applying verified changes to cloud infrastructure."
